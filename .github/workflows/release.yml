name: release

# Pushing a tag `vX.Y.Z` publishes that version to crates.io and opens its GitHub release.
# crates.io trusts this file through Trusted Publishing (crate settings: repository
# Junsung-Kim/rust-jexl3, workflow release.yml, environment release), so no token is stored.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # the OIDC exchange with crates.io
      contents: write   # the GitHub release
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag names the version in Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - run: cargo test --release
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: GitHub release from the CHANGELOG section
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[|^\[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
