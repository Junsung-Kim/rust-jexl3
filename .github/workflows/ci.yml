name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The differential fixtures are committed, so none of this needs a JVM: the jar only
      # has to run when fixtures are regenerated (oracle/build.sh, tools/run_oracle.py).
      - run: cargo build --release
      - run: cargo clippy --release --all-targets -- -D warnings
      # exec_oracle and script_api fail on any difference from the jar that is not listed,
      # with its reason, in tests/data/exec/known_mismatches.txt -- and on a listed one that
      # has started to match.
      - name: cargo test --release --no-fail-fast
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --release --no-fail-fast 2>&1 | tee test.log; then
            # surface the failures as one annotation, so they show on the run page and in the API
            summary=$(grep -E "panicked at|cases differ|not in known|now matches|^---- |^  (field|want|got) " test.log \
                      | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cargo test failed::${summary}"
            exit 1
          fi
      - run: cargo package

  msrv:
    # Cargo.toml says rust-version = "1.80"; this keeps the claim true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80
      - run: cargo build --release --lib
