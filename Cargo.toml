[package]
name = "rust-jexl3"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "A faithful Rust port of Apache Commons JEXL 3.2.1, behaviorally compatible with the Java library"
repository = "https://github.com/Junsung-Kim/rust-jexl3"
homepage = "https://github.com/Junsung-Kim/rust-jexl3"
readme = "README.md"
documentation = "https://docs.rs/rust-jexl3"
keywords = ["jexl", "expression", "script", "interpreter", "template"]
categories = ["parser-implementations", "template-engine"]
# The differential fixtures are 60MB of oracle output: they prove the port against the jar but
# are of no use to a consumer, and they put the package over the registry's size limit.
exclude = [
    "tests/data", "oracle", "fuzz", "tools", "runs",
    "corpus/private*", "target",
]

[lib]
name = "rust_jexl3"

[dependencies]
num-bigint = "0.5"
num-traits = "0.2"
num-integer = "0.1"
log = "0.4"
fancy-regex = "0.14"

[workspace]
members = [".", "harness"]
